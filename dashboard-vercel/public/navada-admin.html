<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0a0f">
  <title>NAVADA Admin</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/theme.css">
  <style>
    :root {
      --bg: #0a0a0f;
      --card: #12121a;
      --border: #1e1e2e;
      --text: #e0e0e0;
      --muted: #888;
      --green: #22c55e;
      --amber: #f59e0b;
      --red: #ef4444;
      --blue: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      -webkit-text-size-adjust: 100%;
      height: 100%;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100%;
      font-size: 14px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 1rem; padding-bottom: 2rem; }

    /* Login view */
    #login-view {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 380px;
    }
    .login-card h1 {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    .login-card input {
      width: 100%;
      padding: 0.7rem 0.9rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .login-card input:focus {
      border-color: var(--blue);
    }
    .login-card input::placeholder {
      color: var(--muted);
    }
    .login-btn {
      width: 100%;
      padding: 0.7rem;
      margin-top: 1rem;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .login-btn:hover { opacity: 0.9; }
    .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .login-error {
      color: var(--red);
      font-size: 0.75rem;
      margin-top: 0.75rem;
      text-align: center;
      min-height: 1.1em;
    }

    /* Dashboard view */
    #dashboard-view { display: none; }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1rem;
      gap: 0.5rem;
    }
    .header h1 { font-size: 1.1rem; font-weight: 600; }
    .logout-btn {
      padding: 0.35rem 0.8rem;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      font-size: 0.75rem;
      font-family: inherit;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    .logout-btn:hover {
      color: var(--red);
      border-color: var(--red);
    }

    /* Stats grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
    }
    .card-title {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    .card-value { font-size: 1.4rem; font-weight: 600; }
    .card-sub { font-size: 0.7rem; color: var(--muted); margin-top: 0.2rem; }

    /* Section */
    .section { margin-bottom: 1rem; }
    .section-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 0.5rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--border);
    }

    /* Table */
    .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.75rem; min-width: 700px; }
    th {
      text-align: left;
      color: var(--muted);
      font-weight: 500;
      padding: 0.5rem 0.4rem;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td {
      padding: 0.5rem 0.4rem;
      border-bottom: 1px solid var(--border);
    }
    .empty {
      color: var(--muted);
      font-style: italic;
      padding: 1.5rem;
      text-align: center;
    }
    .key-cell {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 0.7rem;
      color: var(--blue);
    }

    /* Status tags */
    .status-tag {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 3px;
      font-size: 0.65rem;
      font-weight: 500;
      white-space: nowrap;
    }
    .status-tag.active {
      background: rgba(34,197,94,0.15);
      color: var(--green);
    }
    .status-tag.revoked {
      background: rgba(239,68,68,0.15);
      color: var(--red);
    }

    /* Revoke button */
    .revoke-btn {
      padding: 0.25rem 0.6rem;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 4px;
      color: var(--red);
      font-size: 0.65rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s;
    }
    .revoke-btn:hover {
      background: rgba(239,68,68,0.2);
    }
    .revoke-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Loading spinner */
    .loading-spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 0.4rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Responsive */
    @media (max-width: 768px) {
      .container { padding: 0.5rem; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .card-value { font-size: 1.3rem; }
      table { font-size: 0.7rem; }
      th, td { padding: 0.35rem 0.25rem; }
      .login-card { padding: 1.5rem; }
    }

    @media (max-width: 480px) {
      body { font-size: 12px; }
      .container { padding: 0.4rem; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 0.4rem; }
      .card { padding: 0.5rem; border-radius: 6px; }
      .card-value { font-size: 1.1rem; }
      .card-title { font-size: 0.55rem; }
      .header h1 { font-size: 1rem; }
      table { font-size: 0.65rem; }
      th, td { padding: 0.25rem 0.2rem; }
      .login-card { padding: 1.25rem; }
      .login-card h1 { font-size: 1.1rem; }
    }

    @media (max-width: 375px) {
      .container { padding: 0.3rem; }
      .card { padding: 0.4rem; }
      .card-value { font-size: 1rem; }
      .stats-grid { gap: 0.25rem; }
    }
  </style>
</head>
<body>

  <!-- Login View -->
  <div id="login-view">
    <div class="login-card">
      <h1>Admin Login</h1>
      <input type="password" id="login-password" placeholder="Enter admin password" autocomplete="current-password">
      <button class="login-btn" id="login-btn" onclick="doLogin()">Login</button>
      <div class="login-error" id="login-error"></div>
    </div>
  </div>

  <!-- Dashboard View -->
  <div id="dashboard-view">
    <div class="container">
      <div class="header">
        <h1>NAVADA Admin</h1>
        <button class="logout-btn" onclick="doLogout()">Logout</button>
      </div>

      <div class="stats-grid">
        <div class="card">
          <div class="card-title">Total Keys</div>
          <div class="card-value" id="stat-total">--</div>
        </div>
        <div class="card">
          <div class="card-title">Active Keys</div>
          <div class="card-value" id="stat-active" style="color: var(--green)">--</div>
        </div>
        <div class="card">
          <div class="card-title">Revoked Keys</div>
          <div class="card-value" id="stat-revoked" style="color: var(--red)">--</div>
        </div>
        <div class="card">
          <div class="card-title">Requests Today</div>
          <div class="card-value" id="stat-requests" style="color: var(--blue)">--</div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">API Keys</div>
        <div class="card" style="padding: 0">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Key</th>
                  <th>Label</th>
                  <th>Email</th>
                  <th>Created</th>
                  <th>Status</th>
                  <th>Requests Today</th>
                  <th>Last Used</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="keys-tbody">
                <tr><td colspan="8" class="empty">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- Utility ---
    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s || '';
      return d.innerHTML;
    }

    function formatDate(dateStr) {
      if (!dateStr) return '-';
      try {
        const d = new Date(dateStr);
        return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
      } catch { return dateStr; }
    }

    function formatDateTime(dateStr) {
      if (!dateStr) return '-';
      try {
        const d = new Date(dateStr);
        return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }) + ' ' +
               d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
      } catch { return dateStr; }
    }

    // --- Auth ---
    async function checkAuth() {
      try {
        const res = await fetch('/api/admin/stats', { credentials: 'include' });
        if (res.status === 200) {
          showDashboard();
          const stats = await res.json();
          renderStats(stats);
          loadKeys();
        } else {
          showLogin();
        }
      } catch {
        showLogin();
      }
    }

    function showLogin() {
      document.getElementById('login-view').style.display = 'flex';
      document.getElementById('dashboard-view').style.display = 'none';
    }

    function showDashboard() {
      document.getElementById('login-view').style.display = 'none';
      document.getElementById('dashboard-view').style.display = 'block';
    }

    async function doLogin() {
      const pw = document.getElementById('login-password').value.trim();
      const errEl = document.getElementById('login-error');
      const btn = document.getElementById('login-btn');

      if (!pw) {
        errEl.textContent = 'Please enter a password';
        return;
      }

      errEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Logging in...';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ password: pw }),
        });

        if (res.ok) {
          document.getElementById('login-password').value = '';
          showDashboard();
          loadDashboard();
        } else {
          const data = await res.json().catch(() => ({}));
          errEl.textContent = data.error || 'Invalid password';
        }
      } catch (e) {
        errEl.textContent = 'Connection failed. Please try again.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    }

    function doLogout() {
      document.cookie = 'admin_token=; Path=/; Max-Age=0; SameSite=Strict';
      document.getElementById('login-password').value = '';
      document.getElementById('login-error').textContent = '';
      showLogin();
    }

    // Allow Enter key on password field
    document.getElementById('login-password').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doLogin();
    });

    // --- Dashboard ---
    async function loadDashboard() {
      await loadStats();
      await loadKeys();
    }

    async function loadStats() {
      try {
        const res = await fetch('/api/admin/stats', { credentials: 'include' });
        if (res.status === 401) { showLogin(); return; }
        if (!res.ok) return;
        const stats = await res.json();
        renderStats(stats);
      } catch (e) {
        console.error('Failed to load stats:', e);
      }
    }

    function renderStats(stats) {
      document.getElementById('stat-total').textContent = stats.total_keys ?? '--';
      document.getElementById('stat-active').textContent = stats.active_keys ?? '--';
      document.getElementById('stat-revoked').textContent = stats.revoked_keys ?? '--';
      document.getElementById('stat-requests').textContent = stats.total_requests_today ?? '--';
    }

    async function loadKeys() {
      try {
        const res = await fetch('/api/keys/list', { credentials: 'include' });
        if (res.status === 401) { showLogin(); return; }
        if (!res.ok) {
          document.getElementById('keys-tbody').innerHTML =
            '<tr><td colspan="8" class="empty">Failed to load keys</td></tr>';
          return;
        }
        const data = await res.json();
        renderKeys(data.keys || []);
      } catch (e) {
        console.error('Failed to load keys:', e);
        document.getElementById('keys-tbody').innerHTML =
          '<tr><td colspan="8" class="empty">Connection error</td></tr>';
      }
    }

    function renderKeys(keys) {
      const tbody = document.getElementById('keys-tbody');

      if (!keys.length) {
        tbody.innerHTML = '<tr><td colspan="8" class="empty">No API keys found</td></tr>';
        return;
      }

      tbody.innerHTML = keys.map(k => {
        const fullKey = k.key_full || '';
        const displayKey = k.key_masked || fullKey.slice(0, 8) + '...' + fullKey.slice(-4);
        const isActive = k.status === 'active';

        const actionCell = isActive && fullKey
          ? `<button class="revoke-btn" data-key="${esc(fullKey)}" onclick="revokeKey(this)">Revoke</button>`
          : isActive
            ? `<span class="status-tag active">Active</span>`
            : `<span class="status-tag revoked">Revoked</span>`;

        return `<tr>
          <td class="key-cell">${esc(displayKey)}</td>
          <td>${esc(k.name || '-')}</td>
          <td>${esc(k.email || '-')}</td>
          <td>${formatDate(k.created)}</td>
          <td><span class="status-tag ${isActive ? 'active' : 'revoked'}">${isActive ? 'Active' : 'Revoked'}</span></td>
          <td>${k.requests_today ?? '-'}</td>
          <td>${formatDateTime(k.last_used)}</td>
          <td>${actionCell}</td>
        </tr>`;
      }).join('');
    }

    async function revokeKey(btn) {
      const key = btn.getAttribute('data-key');
      if (!key) return;

      if (!confirm('Revoke this key? This cannot be undone.')) return;

      btn.disabled = true;
      btn.textContent = 'Revoking...';

      try {
        const res = await fetch('/api/keys/revoke', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ key }),
        });

        if (res.status === 401) { showLogin(); return; }

        if (res.ok) {
          await loadStats();
          await loadKeys();
        } else {
          const data = await res.json().catch(() => ({}));
          alert(data.error || 'Failed to revoke key');
          btn.disabled = false;
          btn.textContent = 'Revoke';
        }
      } catch (e) {
        alert('Connection error. Please try again.');
        btn.disabled = false;
        btn.textContent = 'Revoke';
      }
    }

    // --- Init ---
    checkAuth();
  </script>
  <script src="/nav.js"></script>
</body>
</html>
