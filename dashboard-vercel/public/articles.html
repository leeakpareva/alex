<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#16111f">
  <title>Articles — ALEX</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/theme.css">
  <style>
    .page-wrapper {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    /* Back link */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--muted-foreground);
      font-size: 0.875rem;
      margin-bottom: 2rem;
      transition: color 0.2s;
    }
    .back-link:hover {
      color: var(--foreground);
    }
    .back-link svg {
      width: 16px;
      height: 16px;
    }

    /* Hero */
    .hero {
      text-align: center;
      padding: 2rem 0 3rem;
    }
    .hero h1 {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--foreground);
      margin-bottom: 0.75rem;
    }
    .hero p {
      font-size: 1.05rem;
      color: var(--muted-foreground);
      max-width: 520px;
      margin: 0 auto;
    }

    /* Article list */
    .article-list {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      margin-bottom: 3rem;
    }

    /* Article card */
    .article-card {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      padding: 1.5rem;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }
    .article-card:hover {
      border-color: oklch(0.6 0.2 330);
    }

    .article-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 3rem;
      height: 3rem;
      border-radius: 0.75rem;
      background: oklch(0.75 0.25 330 / 0.1);
      border: 1px solid oklch(0.75 0.25 330 / 0.3);
      flex-shrink: 0;
    }
    .article-icon svg {
      width: 1.25rem;
      height: 1.25rem;
      color: var(--neon-pink);
    }

    .article-body {
      flex: 1;
      min-width: 0;
    }

    .article-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--foreground);
      margin-bottom: 0.35rem;
      line-height: 1.3;
    }

    .article-desc {
      font-size: 0.875rem;
      color: var(--muted-foreground);
      line-height: 1.6;
      margin-bottom: 0.5rem;
    }

    .article-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .article-date {
      font-size: 0.8rem;
      color: var(--muted-foreground);
      font-family: 'JetBrains Mono', monospace;
    }
    .article-read-time {
      font-size: 0.75rem;
      color: var(--muted-foreground);
      background: oklch(0.75 0.25 330 / 0.08);
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
    }

    .article-arrow {
      flex-shrink: 0;
      color: var(--muted-foreground);
      transition: color 0.2s, transform 0.2s;
    }
    .article-card:hover .article-arrow {
      color: var(--neon-pink);
      transform: translateX(4px);
    }
    .article-arrow svg {
      width: 1.25rem;
      height: 1.25rem;
    }

    /* Footer */
    .site-footer {
      text-align: center;
      padding: 3rem 0 2.5rem;
      border-top: 1px solid var(--border);
    }
    .footer-name {
      font-size: 0.85rem;
      color: var(--muted-foreground);
      margin-bottom: 0.3rem;
    }
    .footer-brand {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 3px;
      color: oklch(0.4 0.08 290);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .page-wrapper {
        padding: 1.5rem 1.25rem 3rem;
      }
      .hero {
        padding: 1.5rem 0 2rem;
      }
      .hero h1 {
        font-size: 1.85rem;
      }
      .hero p {
        font-size: 0.95rem;
      }
      .article-card {
        padding: 1.25rem;
      }
      .article-title {
        font-size: 1rem;
      }
      .article-arrow {
        display: none;
      }
    }

    @media (max-width: 480px) {
      .page-wrapper {
        padding: 1rem 0.75rem 2.5rem;
      }
      .hero {
        padding: 1rem 0 1.5rem;
      }
      .hero h1 {
        font-size: 1.5rem;
      }
      .hero p {
        font-size: 0.9rem;
      }
      .article-card {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.75rem;
        padding: 1rem;
      }
      .article-title {
        font-size: 0.95rem;
      }
      .article-desc {
        font-size: 0.8rem;
      }
      .article-date {
        font-size: 0.75rem;
      }
      .site-footer {
        padding: 2rem 0 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="page-content">
    <div class="page-wrapper">

      <!-- Back link -->
      <a href="/" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5"/>
          <path d="M12 19l-7-7 7-7"/>
        </svg>
        Back to Home
      </a>

      <!-- Hero -->
      <div class="hero">
        <h1>Articles</h1>
        <p>Research, comparisons, and insights from NAVADA</p>
      </div>

      <!-- Article list -->
      <div class="article-list">

        <!-- Article: ALEX vs OpenClaw -->
        <a href="/articles/alex-vs-openclaw" class="theme-card article-card">
          <div class="article-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
              <polyline points="10 9 9 9 8 9"/>
            </svg>
          </div>
          <div class="article-body">
            <div class="article-title">ALEX vs OpenClaw (Clawdbot/Moltbot) - Unbiased Comparison</div>
            <div class="article-desc">An honest comparison of ALEX and OpenClaw across security, features, cost, and platform support.</div>
            <div class="article-meta">
              <span class="article-date">1 February 2026</span>
              <span class="article-read-time">12 min read</span>
            </div>
          </div>
          <div class="article-arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14"/>
              <path d="M12 5l7 7-7 7"/>
            </svg>
          </div>
        </a>

      </div>

      <!-- Footer -->
      <footer class="site-footer">
        <p class="footer-name">Lee Akpareva MBA, MA</p>
        <p class="footer-brand">NAVADA</p>
      </footer>

    </div>
  </div>

  <script src="/nav.js"></script>
  <script src="/chat-widget.js"></script>
</body>
</html>
