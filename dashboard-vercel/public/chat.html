<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0a0f">
  <title>Chat with ALEX</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/theme.css">
  <style>
    :root {
      --bg: #0a0a0f;
      --card: #12121a;
      --border: #1e1e2e;
      --text: #e0e0e0;
      --muted: #888;
      --green: #22c55e;
      --blue: #3b82f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      height: 100%;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100%;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Chat container fills remaining space below nav */
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      overflow: hidden;
    }

    /* Chat header */
    .chat-header {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .chat-header h1 {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .chat-status {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .chat-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      flex-shrink: 0;
    }

    .chat-status-dot.waiting {
      background: var(--blue);
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .chat-status-text {
      white-space: nowrap;
    }

    /* Messages area */
    .messages-area {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    /* Message bubbles */
    .message {
      display: flex;
      flex-direction: column;
      max-width: 80%;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message.alex {
      align-self: flex-start;
      align-items: flex-start;
    }

    .message-bubble {
      padding: 0.6rem 0.9rem;
      border-radius: 14px;
      font-size: 0.875rem;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .message.user .message-bubble {
      background: var(--blue);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.alex .message-bubble {
      background: var(--border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .message-time {
      font-size: 0.65rem;
      color: var(--muted);
      margin-top: 0.2rem;
      padding: 0 0.25rem;
    }

    /* Typing indicator */
    .typing-indicator {
      display: none;
      align-self: flex-start;
      padding: 0.6rem 0.9rem;
      background: var(--border);
      border-radius: 14px;
      border-bottom-left-radius: 4px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .typing-indicator.visible {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .typing-dots {
      display: inline-flex;
      gap: 3px;
    }

    .typing-dots span {
      width: 5px;
      height: 5px;
      background: var(--muted);
      border-radius: 50%;
      animation: dotBounce 1.4s infinite ease-in-out both;
    }

    .typing-dots span:nth-child(1) { animation-delay: 0s; }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotBounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* Input area */
    .input-area {
      padding: 0.75rem 1rem;
      border-top: 1px solid var(--border);
      background: var(--card);
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
      align-items: flex-end;
      max-width: 100%;
    }

    .input-row input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.65rem 0.9rem;
      color: var(--text);
      font-size: 0.875rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-row input::placeholder {
      color: var(--muted);
    }

    .input-row input:focus {
      border-color: var(--blue);
    }

    .input-row input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .send-btn {
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0.65rem 1rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      white-space: nowrap;
      font-family: inherit;
    }

    .send-btn:hover:not(:disabled) {
      opacity: 0.9;
    }

    .send-btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Footer */
    .chat-footer {
      text-align: center;
      padding: 0.4rem;
      font-size: 0.65rem;
      color: var(--muted);
      flex-shrink: 0;
      border-top: 1px solid var(--border);
    }

    /* Mobile adjustments */
    @media (max-width: 768px) {
      .chat-header {
        padding: 0.6rem 0.75rem;
      }

      .chat-header h1 {
        font-size: 1rem;
      }

      .messages-area {
        padding: 0.75rem;
        gap: 0.6rem;
      }

      .message {
        max-width: 88%;
      }

      .input-area {
        padding: 0.6rem 0.75rem;
      }

      .message-bubble {
        font-size: 0.825rem;
      }
    }

    @media (max-width: 480px) {
      .chat-header h1 {
        font-size: 0.9rem;
      }

      .chat-status {
        font-size: 0.7rem;
      }

      .message {
        max-width: 92%;
      }

      .input-row input {
        padding: 0.55rem 0.75rem;
        font-size: 0.8rem;
      }

      .send-btn {
        padding: 0.55rem 0.8rem;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <h1>Chat with ALEX</h1>
      <div class="chat-status">
        <span class="chat-status-dot" id="status-dot"></span>
        <span class="chat-status-text" id="status-text">Online</span>
      </div>
    </div>

    <div class="messages-area" id="messages-area">
      <div class="typing-indicator" id="typing-indicator">
        ALEX is thinking<span class="typing-dots"><span></span><span></span><span></span></span>
      </div>
    </div>

    <div class="input-area">
      <div class="input-row">
        <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off" />
        <button class="send-btn" id="send-btn">Send</button>
      </div>
    </div>

    <div class="chat-footer">Powered by ALEX &mdash; Global Economist</div>
  </div>

  <script>
    // --- Session & Storage ---
    function getSessionId() {
      let sid = localStorage.getItem('alex-chat-session');
      if (!sid) {
        sid = crypto.randomUUID ? crypto.randomUUID() : 'xxxx-xxxx-xxxx-xxxx'.replace(/x/g, () => Math.floor(Math.random() * 16).toString(16));
        localStorage.setItem('alex-chat-session', sid);
      }
      return sid;
    }

    const sessionId = getSessionId();

    function loadMessages() {
      try {
        const stored = localStorage.getItem('alex-chat-messages');
        return stored ? JSON.parse(stored) : [];
      } catch (e) {
        return [];
      }
    }

    function saveMessages(messages) {
      try {
        localStorage.setItem('alex-chat-messages', JSON.stringify(messages));
      } catch (e) {}
    }

    let messages = loadMessages();

    // --- DOM refs ---
    const messagesArea = document.getElementById('messages-area');
    const typingIndicator = document.getElementById('typing-indicator');
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');

    // --- Time formatting ---
    function formatTime(ts) {
      const d = new Date(ts);
      return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    }

    // --- Render a single message to DOM ---
    function createMessageEl(msg) {
      const wrapper = document.createElement('div');
      wrapper.className = 'message ' + (msg.role === 'user' ? 'user' : 'alex');

      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      bubble.textContent = msg.text;

      const time = document.createElement('div');
      time.className = 'message-time';
      time.textContent = formatTime(msg.timestamp);

      wrapper.appendChild(bubble);
      wrapper.appendChild(time);
      return wrapper;
    }

    // --- Render all messages ---
    function renderMessages() {
      // Remove all messages (keep typing indicator)
      const children = Array.from(messagesArea.children);
      children.forEach(child => {
        if (child !== typingIndicator) {
          messagesArea.removeChild(child);
        }
      });

      // Add messages before the typing indicator
      messages.forEach(msg => {
        messagesArea.insertBefore(createMessageEl(msg), typingIndicator);
      });

      scrollToBottom();
    }

    function appendMessage(msg) {
      messagesArea.insertBefore(createMessageEl(msg), typingIndicator);
      scrollToBottom();
    }

    function scrollToBottom() {
      requestAnimationFrame(() => {
        messagesArea.scrollTop = messagesArea.scrollHeight;
      });
    }

    // --- Status ---
    let isWaiting = false;

    function setWaiting(waiting) {
      isWaiting = waiting;
      chatInput.disabled = waiting;
      sendBtn.disabled = waiting;

      if (waiting) {
        statusDot.classList.add('waiting');
        statusText.textContent = 'Waiting...';
        typingIndicator.classList.add('visible');
      } else {
        statusDot.classList.remove('waiting');
        statusText.textContent = 'Online';
        typingIndicator.classList.remove('visible');
      }

      scrollToBottom();
    }

    // --- Send message ---
    async function sendMessage() {
      const text = chatInput.value.trim();
      if (!text || isWaiting) return;

      // Add user message
      const userMsg = { role: 'user', text: text, timestamp: Date.now() };
      messages.push(userMsg);
      saveMessages(messages);
      appendMessage(userMsg);
      chatInput.value = '';

      setWaiting(true);

      try {
        const res = await fetch('/api/chat/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, sessionId: sessionId })
        });

        if (!res.ok) {
          throw new Error('Failed to send message');
        }

        // Start polling for response
        pollForResponse();
      } catch (e) {
        const errMsg = { role: 'alex', text: 'Sorry, I could not connect to the server. Please try again.', timestamp: Date.now() };
        messages.push(errMsg);
        saveMessages(messages);
        appendMessage(errMsg);
        setWaiting(false);
      }
    }

    // --- Poll for response ---
    let pollCount = 0;
    const MAX_POLL_ATTEMPTS = 90;

    function pollForResponse() {
      pollCount = 0;
      doPoll();
    }

    async function doPoll() {
      if (pollCount >= MAX_POLL_ATTEMPTS) {
        const timeoutMsg = { role: 'alex', text: 'Sorry, the request timed out. Please try again.', timestamp: Date.now() };
        messages.push(timeoutMsg);
        saveMessages(messages);
        appendMessage(timeoutMsg);
        setWaiting(false);
        return;
      }

      pollCount++;
      const delay = pollCount <= 15 ? 1000 : 2000;

      try {
        const res = await fetch('/api/chat/poll?sessionId=' + encodeURIComponent(sessionId) + '&_=' + Date.now());

        if (!res.ok) {
          throw new Error('Poll error');
        }

        const data = await res.json();

        if (data.status === 'complete' && data.response) {
          const alexMsg = { role: 'alex', text: data.response, timestamp: Date.now() };
          messages.push(alexMsg);
          saveMessages(messages);
          appendMessage(alexMsg);
          setWaiting(false);
          return;
        }

        // Still pending, poll again
        setTimeout(doPoll, delay);
      } catch (e) {
        // Retry polling on error
        setTimeout(doPoll, delay);
      }
    }

    // --- Event listeners ---
    sendBtn.addEventListener('click', sendMessage);

    chatInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // --- Init ---
    // Show welcome message if no history
    if (messages.length === 0) {
      const welcome = {
        role: 'alex',
        text: "Hello! I'm ALEX, a global economist and AI assistant. How can I help you today?",
        timestamp: Date.now()
      };
      messages.push(welcome);
      saveMessages(messages);
    }

    renderMessages();
    chatInput.focus();
  </script>

  <script src="/nav.js"></script>
</body>
</html>
