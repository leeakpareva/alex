<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALEX Dashboard</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --card: #12121a;
      --border: #1e1e2e;
      --text: #e0e0e0;
      --muted: #888;
      --green: #22c55e;
      --amber: #f59e0b;
      --red: #ef4444;
      --blue: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 1rem; }

    .header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1rem 0; border-bottom: 1px solid var(--border); margin-bottom: 1rem;
    }
    .header h1 { font-size: 1.25rem; font-weight: 600; }
    .header-info { text-align: right; color: var(--muted); font-size: 0.75rem; }
    .status {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.25rem 0.75rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600;
    }
    .status.online { background: rgba(34,197,94,0.15); color: var(--green); }
    .status.offline { background: rgba(239,68,68,0.15); color: var(--red); }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    .grid { display: grid; gap: 1rem; margin-bottom: 1rem; }
    .grid-4 { grid-template-columns: repeat(4, 1fr); }
    .grid-2 { grid-template-columns: 1fr 1fr; }
    .grid-3 { grid-template-columns: 2fr 1fr 1fr; }
    @media (max-width: 768px) {
      .grid-4, .grid-3 { grid-template-columns: 1fr 1fr; }
      .grid-2 { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
    }
    .card-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }
    .card-value { font-size: 1.5rem; font-weight: 600; }
    .card-sub { font-size: 0.75rem; color: var(--muted); margin-top: 0.25rem; }

    .section { margin-bottom: 1.5rem; }
    .section-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th { text-align: left; color: var(--muted); font-weight: 500; padding: 0.5rem; border-bottom: 1px solid var(--border); }
    td { padding: 0.5rem; border-bottom: 1px solid var(--border); }
    .empty { color: var(--muted); font-style: italic; padding: 1rem; text-align: center; }

    .status-tag { padding: 0.15rem 0.5rem; border-radius: 3px; font-size: 0.7rem; font-weight: 500; }
    .status-tag.online, .status-tag.completed, .status-tag.active { background: rgba(34,197,94,0.15); color: var(--green); }
    .status-tag.offline, .status-tag.failed { background: rgba(239,68,68,0.15); color: var(--red); }
    .status-tag.pending, .status-tag.disabled { background: rgba(136,136,136,0.15); color: var(--muted); }
    .status-tag.in-progress { background: rgba(59,130,246,0.15); color: var(--blue); }

    .activity-item { display: flex; gap: 0.75rem; padding: 0.4rem 0; border-bottom: 1px solid var(--border); font-size: 0.8rem; }
    .activity-time { color: var(--muted); min-width: 60px; }

    .commit-item { display: flex; gap: 0.5rem; padding: 0.4rem 0; border-bottom: 1px solid var(--border); font-size: 0.75rem; align-items: center; }
    .commit-hash { font-family: monospace; color: var(--blue); min-width: 60px; }
    .commit-msg { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .commit-date { color: var(--muted); min-width: 90px; text-align: right; }

    .scroll-box { max-height: 300px; overflow-y: auto; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1 id="dash-title">ALEX Dashboard</h1>
      </div>
      <div class="header-info">
        <div id="current-time"></div>
        <div id="last-updated"></div>
        <div style="margin-top:0.5rem">
          <span id="status-badge" class="status offline">
            <span class="status-dot"></span>
            <span id="status-text">OFFLINE</span>
          </span>
        </div>
      </div>
    </div>

    <div class="grid grid-4">
      <div class="card">
        <div class="card-title">Today's Cost</div>
        <div class="card-value" id="roi-cost">£0.00</div>
        <div class="card-sub"><span id="roi-calls">0</span> API calls</div>
      </div>
      <div class="card">
        <div class="card-title">Tokens Used</div>
        <div class="card-value" id="roi-tokens">0</div>
        <div class="card-sub">Avg: £<span id="roi-avg">0.0000</span>/call</div>
      </div>
      <div class="card">
        <div class="card-title">Tasks</div>
        <div class="card-value"><span id="completed-tasks">0</span>/<span id="total-tasks">0</span></div>
        <div class="card-sub"><span id="in-progress-tasks">0</span> in progress, <span id="failed-tasks">0</span> failed</div>
      </div>
      <div class="card">
        <div class="card-title">Date</div>
        <div class="card-value" id="task-date" style="font-size:1rem"></div>
        <div class="card-sub" id="roi-date"></div>
      </div>
    </div>

    <div class="grid grid-3">
      <div class="section">
        <div class="section-title">Model Usage</div>
        <div class="card" style="padding:0">
          <table>
            <thead><tr><th>Model</th><th>Calls</th><th>In</th><th>Out</th><th>Cost</th></tr></thead>
            <tbody id="model-tbody"><tr><td colspan="5" class="empty">No data</td></tr></tbody>
          </table>
        </div>
      </div>
      <div class="section">
        <div class="section-title">Services</div>
        <div class="card scroll-box" id="services-body"></div>
      </div>
      <div class="section">
        <div class="section-title">Schedules</div>
        <div class="card scroll-box" id="heartbeats-body"></div>
      </div>
    </div>

    <div class="grid grid-2">
      <div class="section">
        <div class="section-title">Activity Log</div>
        <div class="card scroll-box" id="activity-body"></div>
      </div>
      <div class="section">
        <div class="section-title">Recent Commits (<span id="commit-count">0</span>)</div>
        <div class="card scroll-box" id="commits-body"></div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Tasks</div>
      <div class="card" style="padding:0">
        <table>
          <thead><tr><th>Task</th><th>Category</th><th>Status</th><th>Time</th><th>Tokens</th><th>Cost</th></tr></thead>
          <tbody id="task-tbody"><tr><td colspan="6" class="empty">No tasks</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let data = {}, tokenData = {}, commitsData = [];

    async function loadData() {
      try {
        const [d, t, c] = await Promise.all([
          fetch('/api/data?_='+Date.now()).then(r=>r.json()),
          fetch('/api/tokens?_='+Date.now()).then(r=>r.json()),
          fetch('/api/commits?_='+Date.now()).then(r=>r.json()),
        ]);
        data = d || {}; tokenData = t || {}; commitsData = (c && c.commits) || [];
        render();
      } catch(e) { console.error('Load failed:', e); }
    }

    function fmt(n) {
      if (typeof n !== 'number') return n || '-';
      if (n >= 1e6) return (n/1e6).toFixed(1)+'M';
      if (n >= 1e3) return (n/1e3).toFixed(1)+'K';
      return n.toLocaleString();
    }

    function esc(s) { const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

    function render() {
      if (data.title) document.getElementById('dash-title').textContent = data.title;

      const badge = document.getElementById('status-badge');
      badge.className = 'status ' + (data.status === 'online' ? 'online' : 'offline');
      document.getElementById('status-text').textContent = (data.status || 'offline').toUpperCase();

      if (data.last_updated) {
        document.getElementById('last-updated').textContent = 'Updated: ' + new Date(data.last_updated).toLocaleString('en-GB', {timeZone:'Europe/London'});
      }

      const s = data.summary || {};
      document.getElementById('total-tasks').textContent = s.total_tasks || 0;
      document.getElementById('completed-tasks').textContent = s.completed || 0;
      document.getElementById('in-progress-tasks').textContent = s.in_progress || 0;
      document.getElementById('failed-tasks').textContent = s.failed || 0;

      const t = tokenData || {};
      document.getElementById('roi-cost').textContent = '£'+(t.total_cost_gbp||0).toFixed(2);
      document.getElementById('roi-avg').textContent = (t.avg_cost_per_task_gbp||0).toFixed(4);
      document.getElementById('roi-calls').textContent = fmt(t.total_calls||0);
      document.getElementById('roi-tokens').textContent = fmt(t.total_tokens||0);
      document.getElementById('roi-date').textContent = t.date||'';
      document.getElementById('task-date').textContent = t.date||new Date().toISOString().split('T')[0];

      const models = t.by_model || [];
      const mBody = document.getElementById('model-tbody');
      if (!models.length) {
        mBody.innerHTML = '<tr><td colspan="5" class="empty">No API calls today</td></tr>';
      } else {
        mBody.innerHTML = models.map(m=>`<tr>
          <td>${esc(m.model)}</td>
          <td>${m.calls}</td>
          <td>${fmt(m.input_tokens)}</td>
          <td>${fmt(m.output_tokens)}</td>
          <td>£${m.cost_gbp.toFixed(4)}</td>
        </tr>`).join('');
      }

      const tasks = data.tasks || [];
      const tbody = document.getElementById('task-tbody');
      if (!tasks.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty">No tasks</td></tr>';
      } else {
        tbody.innerHTML = tasks.map(tk=>`<tr>
          <td>${esc(tk.name||'')}</td>
          <td>${esc(tk.category||'general')}</td>
          <td><span class="status-tag ${(tk.status||'').replace(/ /g,'-')}">${esc(tk.status||'pending')}</span></td>
          <td>${esc(tk.time||'')}</td>
          <td>${tk.tokens?fmt(tk.tokens):'-'}</td>
          <td>${tk.cost?esc(tk.cost):'-'}</td>
        </tr>`).join('');
      }

      const log = data.activity_log || [];
      const aBody = document.getElementById('activity-body');
      if (!log.length) { aBody.innerHTML = '<div class="empty">No activity</div>'; }
      else {
        aBody.innerHTML = log.slice(0,20).map(a=>`<div class="activity-item">
          <span class="activity-time">${esc(a.time||'')}</span>
          <span>${esc(a.text||'')}</span>
        </div>`).join('');
      }

      const hb = data.heartbeats || [];
      const hBody = document.getElementById('heartbeats-body');
      if (!hb.length) { hBody.innerHTML = '<div class="empty">None</div>'; }
      else {
        hBody.innerHTML = hb.map(h=>`<div class="activity-item">
          <span class="activity-time">${esc(h.schedule||'')}</span>
          <span>${esc(h.name||'')}</span>
          <span class="status-tag ${esc(h.status||'active')}">${(h.status||'active').toUpperCase()}</span>
        </div>`).join('');
      }

      const svc = data.services || [];
      const sBody = document.getElementById('services-body');
      if (!svc.length) { sBody.innerHTML = '<div class="empty">None</div>'; }
      else {
        sBody.innerHTML = svc.map(sv=>`<div class="activity-item">
          <span class="activity-time">${esc(sv.port||'')}</span>
          <span>${esc(sv.name||'')}</span>
          <span class="status-tag ${esc(sv.status||'online')}">${(sv.status||'online').toUpperCase()}</span>
        </div>`).join('');
      }

      const cBody = document.getElementById('commits-body');
      document.getElementById('commit-count').textContent = commitsData.length;
      if (!commitsData.length) { cBody.innerHTML = '<div class="empty">No commits</div>'; }
      else {
        cBody.innerHTML = commitsData.slice(0,15).map(c=>{
          const d = new Date(c.date);
          const ds = d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
          return `<div class="commit-item">
            <span class="commit-hash">${esc(c.short_hash)}</span>
            <span class="commit-msg">${esc(c.message)}</span>
            <span class="commit-date">${ds}</span>
          </div>`;
        }).join('');
      }
    }

    function updateTime() {
      document.getElementById('current-time').textContent = new Date().toLocaleString('en-GB', {
        weekday:'short',day:'numeric',month:'short',year:'numeric',
        hour:'2-digit',minute:'2-digit',second:'2-digit',
        timeZone:'Europe/London'
      });
    }

    updateTime(); setInterval(updateTime,1000);
    loadData(); setInterval(loadData,15000);
  </script>
</body>
</html>
