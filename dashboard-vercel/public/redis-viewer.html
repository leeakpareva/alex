<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0a0f">
  <title>Redis Data Viewer - NAVADA Admin</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/theme.css">
  <style>
    :root {
      --bg: #0a0a0f;
      --card: #12121a;
      --border: #1e1e2e;
      --text: #e0e0e0;
      --muted: #888;
      --green: #22c55e;
      --amber: #f59e0b;
      --red: #ef4444;
      --blue: #3b82f6;
      --purple: #a855f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      -webkit-text-size-adjust: 100%;
      height: 100%;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100%;
      font-size: 14px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 1rem; padding-bottom: 2rem; }

    /* ---- Login View ---- */
    #login-view {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 380px;
    }
    .login-card h1 {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
      text-align: center;
    }
    .login-card .login-sub {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .login-card input {
      width: 100%;
      padding: 0.7rem 0.9rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .login-card input:focus {
      border-color: var(--blue);
    }
    .login-card input::placeholder {
      color: var(--muted);
    }
    .login-btn {
      width: 100%;
      padding: 0.7rem;
      margin-top: 1rem;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .login-btn:hover { opacity: 0.9; }
    .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .login-error {
      color: var(--red);
      font-size: 0.75rem;
      margin-top: 0.75rem;
      text-align: center;
      min-height: 1.1em;
    }

    /* ---- Viewer View ---- */
    #viewer-view { display: none; }

    /* ---- Header ---- */
    .viewer-header {
      position: relative;
      padding: 1.25rem 0 1rem;
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, rgba(59,130,246,0.06) 0%, transparent 40%, rgba(168,85,247,0.06) 70%, rgba(34,197,94,0.04) 100%);
      border-radius: 8px 8px 0 0;
      padding-left: 1rem;
      padding-right: 1rem;
      margin-left: -1rem;
      margin-right: -1rem;
      margin-top: -1rem;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .header-left h1 {
      font-size: 1.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header-left .subtitle {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 0.15rem;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .last-refreshed {
      font-size: 0.7rem;
      color: var(--muted);
    }
    .logout-btn {
      padding: 0.35rem 0.8rem;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      font-size: 0.75rem;
      font-family: inherit;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    .logout-btn:hover {
      color: var(--red);
      border-color: var(--red);
    }

    /* ---- Auto-refresh toggle ---- */
    .auto-refresh-toggle {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.7rem;
      color: var(--muted);
    }
    .toggle-switch {
      position: relative;
      width: 36px;
      height: 20px;
      cursor: pointer;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle-slider {
      position: absolute;
      inset: 0;
      background: var(--border);
      border-radius: 10px;
      transition: background 0.2s;
    }
    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      left: 3px;
      top: 3px;
      background: var(--muted);
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }
    .toggle-switch input:checked + .toggle-slider {
      background: rgba(59,130,246,0.3);
    }
    .toggle-switch input:checked + .toggle-slider::before {
      transform: translateX(16px);
      background: var(--blue);
    }
    .countdown-text {
      font-size: 0.65rem;
      color: var(--muted);
      min-width: 2rem;
    }

    /* ---- Stats Bar ---- */
    .stats-bar {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .stat-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.35rem 0.7rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.7rem;
      color: var(--muted);
      transition: border-color 0.2s;
    }
    .stat-badge .stat-count {
      font-weight: 600;
      color: var(--text);
    }
    .stat-badge.total {
      border-color: var(--blue);
    }
    .stat-badge.total .stat-count {
      color: var(--blue);
    }

    /* ---- Key Groups Panel ---- */
    .groups-section {
      margin-bottom: 1rem;
    }
    .section-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }
    .groups-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 0.5rem;
    }
    .group-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 0.75rem;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .group-card:hover {
      border-color: var(--blue);
      background: rgba(59,130,246,0.04);
    }
    .group-card.active {
      border-color: var(--blue);
      background: rgba(59,130,246,0.08);
    }
    .group-card .group-name {
      font-size: 0.75rem;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      color: var(--blue);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .group-card .group-count {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text);
      background: var(--bg);
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      flex-shrink: 0;
      margin-left: 0.5rem;
    }

    /* ---- Search / Filter ---- */
    .filter-bar {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
      align-items: center;
    }
    .filter-input {
      flex: 1;
      padding: 0.5rem 0.75rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.8rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .filter-input:focus {
      border-color: var(--blue);
    }
    .filter-input::placeholder {
      color: var(--muted);
    }
    .clear-filter-btn {
      padding: 0.5rem 0.75rem;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      font-size: 0.75rem;
      font-family: inherit;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
      white-space: nowrap;
    }
    .clear-filter-btn:hover {
      color: var(--text);
      border-color: var(--text);
    }

    /* ---- Key List Table ---- */
    .table-section { margin-bottom: 1rem; }
    .table-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.75rem; min-width: 600px; }
    th {
      text-align: left;
      color: var(--muted);
      font-weight: 500;
      padding: 0.6rem 0.6rem;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      transition: color 0.2s;
    }
    th:hover {
      color: var(--text);
    }
    th .sort-arrow {
      display: inline-block;
      margin-left: 0.25rem;
      font-size: 0.6rem;
      opacity: 0.4;
      transition: opacity 0.2s;
    }
    th.sorted .sort-arrow {
      opacity: 1;
      color: var(--blue);
    }
    td {
      padding: 0.5rem 0.6rem;
      border-bottom: 1px solid var(--border);
    }
    tr:last-child td {
      border-bottom: none;
    }
    tr:hover td {
      background: rgba(59,130,246,0.03);
    }
    .key-cell {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 0.7rem;
      color: var(--blue);
      cursor: pointer;
      transition: color 0.2s;
      word-break: break-all;
    }
    .key-cell:hover {
      color: #60a5fa;
      text-decoration: underline;
    }
    .empty-row {
      color: var(--muted);
      font-style: italic;
      padding: 1.5rem;
      text-align: center;
    }

    /* Type badges */
    .type-badge {
      display: inline-block;
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
      font-size: 0.65rem;
      font-weight: 500;
      text-transform: lowercase;
      white-space: nowrap;
    }
    .type-string {
      background: rgba(34,197,94,0.12);
      color: var(--green);
    }
    .type-hash {
      background: rgba(59,130,246,0.12);
      color: var(--blue);
    }
    .type-set {
      background: rgba(245,158,11,0.12);
      color: var(--amber);
    }
    .type-list {
      background: rgba(168,85,247,0.12);
      color: var(--purple);
    }
    .type-zset {
      background: rgba(236,72,153,0.12);
      color: #ec4899;
    }
    .type-unknown {
      background: rgba(136,136,136,0.12);
      color: var(--muted);
    }

    /* TTL cell */
    .ttl-cell {
      font-size: 0.7rem;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    }
    .ttl-none {
      color: var(--muted);
    }
    .ttl-value {
      color: var(--amber);
    }

    /* Action buttons */
    .view-btn {
      padding: 0.2rem 0.5rem;
      background: rgba(59,130,246,0.1);
      border: 1px solid rgba(59,130,246,0.3);
      border-radius: 4px;
      color: var(--blue);
      font-size: 0.65rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .view-btn:hover {
      background: rgba(59,130,246,0.2);
    }

    /* ---- Modal Overlay ---- */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      animation: modalFadeIn 0.15s ease-out;
    }
    .modal-overlay.visible {
      display: flex;
    }
    @keyframes modalFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 700px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      animation: modalSlideIn 0.15s ease-out;
    }
    @keyframes modalSlideIn {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      gap: 0.75rem;
    }
    .modal-header-info {
      flex: 1;
      min-width: 0;
    }
    .modal-key-name {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 0.85rem;
      color: var(--blue);
      word-break: break-all;
      margin-bottom: 0.35rem;
    }
    .modal-meta {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .modal-meta-item {
      font-size: 0.7rem;
      color: var(--muted);
    }
    .modal-meta-item span {
      color: var(--text);
      font-weight: 500;
    }
    .modal-close-btn {
      padding: 0.35rem 0.7rem;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      font-size: 0.75rem;
      font-family: inherit;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
      flex-shrink: 0;
    }
    .modal-close-btn:hover {
      color: var(--text);
      border-color: var(--text);
    }
    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.25rem;
    }
    .modal-value-pre {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem;
      overflow-x: auto;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 0.75rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text);
      max-height: 60vh;
    }
    /* JSON syntax highlighting */
    .json-key { color: var(--blue); }
    .json-string { color: var(--green); }
    .json-number { color: var(--amber); }
    .json-bool { color: var(--purple); }
    .json-null { color: var(--muted); }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      padding: 0.75rem 1.25rem;
      border-top: 1px solid var(--border);
    }
    .copy-btn {
      padding: 0.4rem 0.9rem;
      background: rgba(34,197,94,0.1);
      border: 1px solid rgba(34,197,94,0.3);
      border-radius: 6px;
      color: var(--green);
      font-size: 0.75rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s;
    }
    .copy-btn:hover {
      background: rgba(34,197,94,0.2);
    }
    .close-btn-footer {
      padding: 0.4rem 0.9rem;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    .close-btn-footer:hover {
      color: var(--text);
      border-color: var(--text);
    }

    /* ---- Loading spinner ---- */
    .loading-spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 0.4rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-full {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem;
      color: var(--muted);
      font-size: 0.8rem;
    }

    /* ---- Mobile Card Layout ---- */
    .mobile-cards { display: none; }
    .mobile-key-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      margin-bottom: 0.5rem;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .mobile-key-card:hover {
      border-color: var(--blue);
    }
    .mobile-key-card .mkc-key {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 0.75rem;
      color: var(--blue);
      word-break: break-all;
      margin-bottom: 0.4rem;
    }
    .mobile-key-card .mkc-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }
    .mobile-key-card .mkc-meta {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    /* ---- Responsive ---- */
    @media (max-width: 768px) {
      .container { padding: 0.5rem; }
      .viewer-header {
        padding-left: 0.5rem;
        padding-right: 0.5rem;
        margin-left: -0.5rem;
        margin-right: -0.5rem;
      }
      .header-top { flex-direction: column; }
      .header-right { width: 100%; justify-content: space-between; }
      .groups-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
      .stats-bar { gap: 0.35rem; }
      .stat-badge { font-size: 0.65rem; padding: 0.25rem 0.5rem; }
      .login-card { padding: 1.5rem; }
      .modal { max-width: 100%; margin: 0.5rem; }
      .modal-header { padding: 0.75rem 1rem; }
      .modal-body { padding: 0.75rem 1rem; }
      .modal-footer { padding: 0.5rem 1rem; }
    }

    @media (max-width: 640px) {
      /* Switch from table to cards on narrow screens */
      .table-card { display: none; }
      .mobile-cards { display: block; }
      .groups-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 480px) {
      body { font-size: 12px; }
      .container { padding: 0.4rem; }
      .viewer-header {
        padding-left: 0.4rem;
        padding-right: 0.4rem;
        margin-left: -0.4rem;
        margin-right: -0.4rem;
      }
      .header-left h1 { font-size: 1rem; }
      .login-card { padding: 1.25rem; }
      .login-card h1 { font-size: 1.1rem; }
      .groups-grid { grid-template-columns: repeat(2, 1fr); gap: 0.35rem; }
      .group-card { padding: 0.4rem 0.6rem; }
      .group-card .group-name { font-size: 0.7rem; }
      .modal-value-pre { font-size: 0.65rem; padding: 0.5rem; }
    }

    @media (max-width: 375px) {
      .container { padding: 0.3rem; }
      .stats-bar { gap: 0.25rem; }
    }
  </style>
</head>
<body>

  <!-- Login View -->
  <div id="login-view">
    <div class="login-card">
      <h1>Redis Data Viewer</h1>
      <div class="login-sub">NAVADA Admin</div>
      <input type="password" id="login-password" placeholder="Enter admin password" autocomplete="current-password">
      <button class="login-btn" id="login-btn" onclick="doLogin()">Login</button>
      <div class="login-error" id="login-error"></div>
    </div>
  </div>

  <!-- Viewer View -->
  <div id="viewer-view">
    <div class="container">

      <!-- Header -->
      <div class="viewer-header">
        <div class="header-top">
          <div class="header-left">
            <h1>Redis Data Viewer</h1>
            <div class="subtitle">NAVADA Admin</div>
          </div>
          <div class="header-right">
            <div class="auto-refresh-toggle">
              <label class="toggle-switch">
                <input type="checkbox" id="auto-refresh-toggle" checked>
                <span class="toggle-slider"></span>
              </label>
              <span>Auto-refresh</span>
              <span class="countdown-text" id="countdown-text">30s</span>
            </div>
            <span class="last-refreshed" id="last-refreshed">--</span>
            <button class="logout-btn" onclick="doLogout()">Logout</button>
          </div>
        </div>
      </div>

      <!-- Stats Bar -->
      <div class="stats-bar" id="stats-bar">
        <div class="stat-badge total">
          <span>Total Keys:</span>
          <span class="stat-count" id="stat-total">--</span>
        </div>
      </div>

      <!-- Key Groups Panel -->
      <div class="groups-section">
        <div class="section-label">Key Groups</div>
        <div class="groups-grid" id="groups-grid">
          <div class="loading-full"><span class="loading-spinner"></span> Loading groups...</div>
        </div>
      </div>

      <!-- Search / Filter -->
      <div class="filter-bar">
        <input type="text" class="filter-input" id="filter-input" placeholder="Search keys..." oninput="applyFilter()">
        <button class="clear-filter-btn" onclick="clearFilter()">Clear</button>
      </div>

      <!-- Key List Table (desktop) -->
      <div class="table-section">
        <div class="table-card">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th data-sort="key" onclick="toggleSort('key')">Key Name <span class="sort-arrow">&#9650;</span></th>
                  <th data-sort="type" onclick="toggleSort('type')">Type <span class="sort-arrow">&#9650;</span></th>
                  <th data-sort="ttl" onclick="toggleSort('ttl')">TTL <span class="sort-arrow">&#9650;</span></th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="keys-tbody">
                <tr><td colspan="4" class="empty-row"><span class="loading-spinner"></span> Loading keys...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Mobile card layout -->
        <div class="mobile-cards" id="mobile-cards"></div>
      </div>

    </div>
  </div>

  <!-- Value Viewer Modal -->
  <div class="modal-overlay" id="modal-overlay" onclick="onOverlayClick(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-header-info">
          <div class="modal-key-name" id="modal-key-name">--</div>
          <div class="modal-meta">
            <div class="modal-meta-item">Type: <span id="modal-type">--</span></div>
            <div class="modal-meta-item">TTL: <span id="modal-ttl">--</span></div>
            <div class="modal-meta-item">Size: <span id="modal-size">--</span></div>
          </div>
        </div>
        <button class="modal-close-btn" onclick="closeModal()">Esc</button>
      </div>
      <div class="modal-body">
        <pre class="modal-value-pre" id="modal-value">Loading...</pre>
      </div>
      <div class="modal-footer">
        <button class="copy-btn" id="copy-btn" onclick="copyValue()">Copy Value</button>
        <button class="close-btn-footer" onclick="closeModal()">Close</button>
      </div>
    </div>
  </div>

  <script>
    // ---- State ----
    let allKeys = [];
    let groups = {};
    let activeGroup = null;
    let currentSort = { field: 'key', dir: 'asc' };
    let refreshInterval = null;
    let countdownInterval = null;
    let countdown = 30;
    let currentModalValue = '';

    // ---- Utility ----
    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s || '';
      return d.innerHTML;
    }

    function formatTTL(ttl) {
      if (ttl === null || ttl === undefined || ttl === -1) return '<span class="ttl-none">none</span>';
      if (ttl === -2) return '<span class="ttl-none">expired</span>';
      if (ttl < 60) return `<span class="ttl-value">${ttl}s</span>`;
      if (ttl < 3600) return `<span class="ttl-value">${Math.floor(ttl / 60)}m ${ttl % 60}s</span>`;
      if (ttl < 86400) return `<span class="ttl-value">${Math.floor(ttl / 3600)}h ${Math.floor((ttl % 3600) / 60)}m</span>`;
      return `<span class="ttl-value">${Math.floor(ttl / 86400)}d ${Math.floor((ttl % 86400) / 3600)}h</span>`;
    }

    function getTypeClass(type) {
      const t = (type || '').toLowerCase();
      if (t === 'string') return 'type-string';
      if (t === 'hash') return 'type-hash';
      if (t === 'set') return 'type-set';
      if (t === 'list') return 'type-list';
      if (t === 'zset') return 'type-zset';
      return 'type-unknown';
    }

    function getPrefix(key) {
      const colonIdx = key.indexOf(':');
      if (colonIdx > 0 && colonIdx < key.length - 1) {
        return key.substring(0, colonIdx) + ':*';
      }
      return '(no prefix)';
    }

    function formatTimestamp() {
      const now = new Date();
      return now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function humanSize(str) {
      if (!str) return '0 B';
      const bytes = new Blob([str]).size;
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    // ---- JSON Syntax Highlighting ----
    function highlightJSON(str) {
      // Escape HTML first
      const escaped = esc(str);
      // Apply syntax highlighting via regex on the escaped string
      return escaped
        .replace(/"([^"\\]*(\\.[^"\\]*)*)"\s*:/g, '<span class="json-key">"$1"</span>:')
        .replace(/:\s*"([^"\\]*(\\.[^"\\]*)*)"/g, ': <span class="json-string">"$1"</span>')
        .replace(/:\s*(-?\d+\.?\d*([eE][+-]?\d+)?)/g, ': <span class="json-number">$1</span>')
        .replace(/:\s*(true|false)/g, ': <span class="json-bool">$1</span>')
        .replace(/:\s*(null)/g, ': <span class="json-null">$1</span>');
    }

    // ---- Auth ----
    async function checkAuth() {
      try {
        const res = await fetch('/api/admin/redis', { credentials: 'include' });
        if (res.status === 200) {
          showViewer();
          const data = await res.json();
          processData(data);
        } else {
          showLogin();
        }
      } catch {
        showLogin();
      }
    }

    function showLogin() {
      document.getElementById('login-view').style.display = 'flex';
      document.getElementById('viewer-view').style.display = 'none';
      stopAutoRefresh();
    }

    function showViewer() {
      document.getElementById('login-view').style.display = 'none';
      document.getElementById('viewer-view').style.display = 'block';
      startAutoRefresh();
    }

    async function doLogin() {
      const pw = document.getElementById('login-password').value.trim();
      const errEl = document.getElementById('login-error');
      const btn = document.getElementById('login-btn');

      if (!pw) {
        errEl.textContent = 'Please enter a password';
        return;
      }

      errEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Logging in...';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ password: pw }),
        });

        if (res.ok) {
          document.getElementById('login-password').value = '';
          showViewer();
          loadKeys();
        } else {
          const data = await res.json().catch(() => ({}));
          errEl.textContent = data.error || 'Invalid password';
        }
      } catch (e) {
        errEl.textContent = 'Connection failed. Please try again.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    }

    function doLogout() {
      document.cookie = 'admin_token=; Path=/; Max-Age=0; SameSite=Strict';
      document.getElementById('login-password').value = '';
      document.getElementById('login-error').textContent = '';
      stopAutoRefresh();
      showLogin();
    }

    document.getElementById('login-password').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doLogin();
    });

    // ---- Data Loading ----
    async function loadKeys() {
      try {
        const res = await fetch('/api/admin/redis', { credentials: 'include' });
        if (res.status === 401) { showLogin(); return; }
        if (!res.ok) {
          document.getElementById('keys-tbody').innerHTML =
            '<tr><td colspan="4" class="empty-row">Failed to load keys</td></tr>';
          document.getElementById('mobile-cards').innerHTML =
            '<div class="loading-full">Failed to load keys</div>';
          return;
        }
        const data = await res.json();
        processData(data);
      } catch (e) {
        console.error('Failed to load keys:', e);
        document.getElementById('keys-tbody').innerHTML =
          '<tr><td colspan="4" class="empty-row">Connection error</td></tr>';
        document.getElementById('mobile-cards').innerHTML =
          '<div class="loading-full">Connection error</div>';
      }
    }

    function processData(data) {
      // The API can return data in different shapes.
      // Expected: { keys: [...], groups: { prefix: [...] } }
      // or: { keys: [{ key, type, ttl }] }
      if (data.groups && typeof data.groups === 'object') {
        groups = data.groups;
        // Flatten all keys from groups if keys array not provided
        if (!data.keys || !Array.isArray(data.keys)) {
          allKeys = [];
          for (const prefix in data.groups) {
            const items = data.groups[prefix];
            if (Array.isArray(items)) {
              items.forEach(item => {
                if (typeof item === 'string') {
                  allKeys.push({ key: item, type: 'unknown', ttl: -1 });
                } else {
                  allKeys.push(item);
                }
              });
            }
          }
        } else {
          allKeys = data.keys;
        }
      } else if (data.keys && Array.isArray(data.keys)) {
        allKeys = data.keys;
        // Build groups from keys
        groups = {};
        allKeys.forEach(k => {
          const keyName = typeof k === 'string' ? k : k.key;
          const prefix = getPrefix(keyName);
          if (!groups[prefix]) groups[prefix] = [];
          groups[prefix].push(k);
        });
      } else if (Array.isArray(data)) {
        allKeys = data.map(k => typeof k === 'string' ? { key: k, type: 'unknown', ttl: -1 } : k);
        groups = {};
        allKeys.forEach(k => {
          const prefix = getPrefix(k.key);
          if (!groups[prefix]) groups[prefix] = [];
          groups[prefix].push(k);
        });
      } else {
        allKeys = [];
        groups = {};
      }

      // Normalize keys to objects
      allKeys = allKeys.map(k => {
        if (typeof k === 'string') return { key: k, type: 'unknown', ttl: -1 };
        return { key: k.key || k.name || '', type: k.type || 'unknown', ttl: k.ttl !== undefined ? k.ttl : -1 };
      });

      renderStats();
      renderGroups();
      renderKeyList();
      document.getElementById('last-refreshed').textContent = 'Updated ' + formatTimestamp();
    }

    // ---- Render Stats Bar ----
    function renderStats() {
      const statsBar = document.getElementById('stats-bar');
      let html = `<div class="stat-badge total"><span>Total Keys:</span> <span class="stat-count">${allKeys.length}</span></div>`;

      const prefixCounts = {};
      for (const prefix in groups) {
        const count = Array.isArray(groups[prefix]) ? groups[prefix].length : 0;
        if (count > 0) prefixCounts[prefix] = count;
      }

      const sortedPrefixes = Object.keys(prefixCounts).sort((a, b) => prefixCounts[b] - prefixCounts[a]);
      sortedPrefixes.slice(0, 6).forEach(prefix => {
        html += `<div class="stat-badge"><span>${esc(prefix)}</span> <span class="stat-count">${prefixCounts[prefix]}</span></div>`;
      });

      statsBar.innerHTML = html;
      document.getElementById('stat-total').textContent = allKeys.length;
    }

    // ---- Render Groups ----
    function renderGroups() {
      const grid = document.getElementById('groups-grid');
      const prefixCounts = {};

      for (const prefix in groups) {
        const count = Array.isArray(groups[prefix]) ? groups[prefix].length : 0;
        if (count > 0) prefixCounts[prefix] = count;
      }

      const sortedPrefixes = Object.keys(prefixCounts).sort((a, b) => prefixCounts[b] - prefixCounts[a]);

      if (sortedPrefixes.length === 0) {
        grid.innerHTML = '<div class="loading-full">No key groups found</div>';
        return;
      }

      // Add an "All" card first
      let html = `<div class="group-card${activeGroup === null ? ' active' : ''}" onclick="selectGroup(null)">
        <span class="group-name">All Keys</span>
        <span class="group-count">${allKeys.length}</span>
      </div>`;

      sortedPrefixes.forEach(prefix => {
        const isActive = activeGroup === prefix;
        html += `<div class="group-card${isActive ? ' active' : ''}" onclick="selectGroup('${esc(prefix)}')">
          <span class="group-name">${esc(prefix)}</span>
          <span class="group-count">${prefixCounts[prefix]}</span>
        </div>`;
      });

      grid.innerHTML = html;
    }

    // ---- Group Selection ----
    function selectGroup(prefix) {
      activeGroup = prefix;
      renderGroups();
      renderKeyList();
      // Update filter hint
      document.getElementById('filter-input').placeholder = prefix
        ? `Search in ${prefix}...`
        : 'Search keys...';
    }

    // ---- Sorting ----
    function toggleSort(field) {
      if (currentSort.field === field) {
        currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc';
      } else {
        currentSort.field = field;
        currentSort.dir = 'asc';
      }
      renderKeyList();
    }

    function sortKeys(keys) {
      const { field, dir } = currentSort;
      const mult = dir === 'asc' ? 1 : -1;

      return [...keys].sort((a, b) => {
        let va, vb;
        if (field === 'key') {
          va = (a.key || '').toLowerCase();
          vb = (b.key || '').toLowerCase();
          return va < vb ? -1 * mult : va > vb ? 1 * mult : 0;
        }
        if (field === 'type') {
          va = (a.type || '').toLowerCase();
          vb = (b.type || '').toLowerCase();
          return va < vb ? -1 * mult : va > vb ? 1 * mult : 0;
        }
        if (field === 'ttl') {
          va = a.ttl === -1 ? Infinity : a.ttl;
          vb = b.ttl === -1 ? Infinity : b.ttl;
          return (va - vb) * mult;
        }
        return 0;
      });
    }

    // ---- Filtering ----
    function getFilteredKeys() {
      let keys = allKeys;

      // Filter by group
      if (activeGroup && groups[activeGroup]) {
        const groupKeySet = new Set();
        groups[activeGroup].forEach(k => {
          const keyName = typeof k === 'string' ? k : (k.key || k.name || '');
          groupKeySet.add(keyName);
        });
        keys = keys.filter(k => groupKeySet.has(k.key));
      }

      // Filter by search text
      const filterText = (document.getElementById('filter-input').value || '').toLowerCase().trim();
      if (filterText) {
        keys = keys.filter(k => k.key.toLowerCase().includes(filterText));
      }

      return sortKeys(keys);
    }

    function applyFilter() {
      renderKeyList();
    }

    function clearFilter() {
      document.getElementById('filter-input').value = '';
      activeGroup = null;
      renderGroups();
      renderKeyList();
    }

    // ---- Render Key List (Table) ----
    function renderKeyList() {
      const keys = getFilteredKeys();
      const tbody = document.getElementById('keys-tbody');
      const mobileContainer = document.getElementById('mobile-cards');

      // Update sort arrows
      document.querySelectorAll('th[data-sort]').forEach(th => {
        const field = th.getAttribute('data-sort');
        const arrow = th.querySelector('.sort-arrow');
        if (field === currentSort.field) {
          th.classList.add('sorted');
          arrow.innerHTML = currentSort.dir === 'asc' ? '&#9650;' : '&#9660;';
        } else {
          th.classList.remove('sorted');
          arrow.innerHTML = '&#9650;';
        }
      });

      if (keys.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty-row">No keys found</td></tr>';
        mobileContainer.innerHTML = '<div class="loading-full">No keys found</div>';
        return;
      }

      // Desktop table
      tbody.innerHTML = keys.map(k => {
        const typeClass = getTypeClass(k.type);
        return `<tr>
          <td class="key-cell" onclick="loadKeyValue('${esc(k.key)}')" title="${esc(k.key)}">${esc(k.key)}</td>
          <td><span class="type-badge ${typeClass}">${esc(k.type)}</span></td>
          <td class="ttl-cell">${formatTTL(k.ttl)}</td>
          <td><button class="view-btn" onclick="loadKeyValue('${esc(k.key)}')">View</button></td>
        </tr>`;
      }).join('');

      // Mobile cards
      mobileContainer.innerHTML = keys.map(k => {
        const typeClass = getTypeClass(k.type);
        return `<div class="mobile-key-card" onclick="loadKeyValue('${esc(k.key)}')">
          <div class="mkc-key">${esc(k.key)}</div>
          <div class="mkc-row">
            <div class="mkc-meta">
              <span class="type-badge ${typeClass}">${esc(k.type)}</span>
              <span class="ttl-cell">${formatTTL(k.ttl)}</span>
            </div>
            <button class="view-btn" onclick="event.stopPropagation(); loadKeyValue('${esc(k.key)}')">View</button>
          </div>
        </div>`;
      }).join('');
    }

    // ---- Load Key Value (Modal) ----
    async function loadKeyValue(keyName) {
      const overlay = document.getElementById('modal-overlay');
      const keyEl = document.getElementById('modal-key-name');
      const typeEl = document.getElementById('modal-type');
      const ttlEl = document.getElementById('modal-ttl');
      const sizeEl = document.getElementById('modal-size');
      const valueEl = document.getElementById('modal-value');

      // Show modal with loading state
      keyEl.textContent = keyName;
      typeEl.textContent = '--';
      ttlEl.textContent = '--';
      sizeEl.textContent = '--';
      valueEl.innerHTML = '<span class="loading-spinner"></span> Loading...';
      currentModalValue = '';
      overlay.classList.add('visible');

      try {
        const res = await fetch(`/api/admin/redis?key=${encodeURIComponent(keyName)}`, { credentials: 'include' });
        if (res.status === 401) { closeModal(); showLogin(); return; }
        if (!res.ok) {
          valueEl.textContent = 'Failed to load value (HTTP ' + res.status + ')';
          return;
        }
        const data = await res.json();

        typeEl.textContent = data.type || 'unknown';
        ttlEl.textContent = data.ttl === -1 ? 'none' : (data.ttl !== undefined ? data.ttl + 's' : 'unknown');

        // Format the value
        let rawValue;
        if (data.value !== undefined) {
          rawValue = data.value;
        } else if (data.data !== undefined) {
          rawValue = data.data;
        } else {
          // The response itself might be the value
          const { key, type, ttl, ...rest } = data;
          rawValue = Object.keys(rest).length > 0 ? rest : data;
        }

        let displayStr;
        if (typeof rawValue === 'string') {
          // Try to parse as JSON for pretty printing
          try {
            const parsed = JSON.parse(rawValue);
            displayStr = JSON.stringify(parsed, null, 2);
          } catch {
            displayStr = rawValue;
          }
        } else if (rawValue === null || rawValue === undefined) {
          displayStr = '(null)';
        } else {
          displayStr = JSON.stringify(rawValue, null, 2);
        }

        currentModalValue = displayStr;
        sizeEl.textContent = humanSize(displayStr);

        // Apply syntax highlighting if it looks like JSON
        if (displayStr.trim().startsWith('{') || displayStr.trim().startsWith('[')) {
          valueEl.innerHTML = highlightJSON(displayStr);
        } else {
          valueEl.textContent = displayStr;
        }
      } catch (e) {
        console.error('Failed to load key value:', e);
        valueEl.textContent = 'Connection error: ' + e.message;
      }
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('visible');
      currentModalValue = '';
    }

    function onOverlayClick(event) {
      if (event.target === document.getElementById('modal-overlay')) {
        closeModal();
      }
    }

    async function copyValue() {
      const btn = document.getElementById('copy-btn');
      try {
        await navigator.clipboard.writeText(currentModalValue);
        btn.textContent = 'Copied!';
        btn.style.color = 'var(--green)';
        setTimeout(() => {
          btn.textContent = 'Copy Value';
          btn.style.color = '';
        }, 2000);
      } catch {
        // Fallback for non-HTTPS or older browsers
        const ta = document.createElement('textarea');
        ta.value = currentModalValue;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          btn.textContent = 'Copied!';
          btn.style.color = 'var(--green)';
          setTimeout(() => {
            btn.textContent = 'Copy Value';
            btn.style.color = '';
          }, 2000);
        } catch {
          btn.textContent = 'Copy failed';
          setTimeout(() => { btn.textContent = 'Copy Value'; }, 2000);
        }
        document.body.removeChild(ta);
      }
    }

    // Escape key to close modal
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && document.getElementById('modal-overlay').classList.contains('visible')) {
        closeModal();
      }
    });

    // ---- Auto-Refresh ----
    function startAutoRefresh() {
      const toggle = document.getElementById('auto-refresh-toggle');
      if (!toggle.checked) return;

      countdown = 30;
      updateCountdown();

      countdownInterval = setInterval(() => {
        countdown--;
        updateCountdown();
        if (countdown <= 0) {
          loadKeys();
          countdown = 30;
        }
      }, 1000);
    }

    function stopAutoRefresh() {
      if (countdownInterval) {
        clearInterval(countdownInterval);
        countdownInterval = null;
      }
      countdown = 30;
      updateCountdown();
    }

    function updateCountdown() {
      const el = document.getElementById('countdown-text');
      const toggle = document.getElementById('auto-refresh-toggle');
      if (toggle && toggle.checked) {
        el.textContent = countdown + 's';
      } else {
        el.textContent = 'off';
      }
    }

    document.getElementById('auto-refresh-toggle').addEventListener('change', function() {
      if (this.checked) {
        startAutoRefresh();
      } else {
        stopAutoRefresh();
      }
    });

    // ---- Init ----
    checkAuth();
  </script>
  <script src="/nav.js"></script>
</body>
</html>
